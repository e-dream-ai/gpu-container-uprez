name: Build and Push Video Upscaler Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Optional Docker tag suffix"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: container-builder
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TAG_SUFFIX: ${{ github.event.inputs.docker_tag }}
        run: |
          IMAGE_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION="${TIMESTAMP}-${BRANCH}"

          if [ -n "$TAG_SUFFIX" ]; then
            VERSION="${VERSION}-${TAG_SUFFIX}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${REGISTRY}/${IMAGE_LOWER}:${VERSION}" >> $GITHUB_OUTPUT
          echo "latest_tag=${REGISTRY}/${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image information
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
        run: |
          echo "Successfully built and pushed:"
          echo "Image: ${IMAGE_TAG}"
          echo "Latest: ${LATEST_TAG}"
          echo ""
          echo "Use this image in your RunPod serverless endpoint:"
          echo "   ${IMAGE_TAG}"
